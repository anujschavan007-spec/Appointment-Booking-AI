<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiraAI Admin Panel - Clinical Voice & Appointment Platform</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>

  <!-- Left Sidebar (Matching reference image) -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"></div>
      <div class="sidebar-title-group">
        <h2>MiraAI</h2>
        <span>Admin Panel</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-link active" data-view="dashboard">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Dashboard</span>
      </a>

      <a href="/admin/doctors" class="nav-link" data-view="doctors">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        <span>Doctors Roster</span>
      </a>

      <a href="/admin/availability" class="nav-link" data-view="availability">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Working Hours & Leaves</span>
      </a>

      <a href="/admin/appointments" class="nav-link" data-view="appointments">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Appointments & Calendar</span>
      </a>

      <a href="/admin/consultations" class="nav-link" data-view="consultations">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
        <span>Voice Consultations</span>
      </a>

      <a href="/admin/users" class="nav-link" data-view="users">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span>Registered Patients</span>
      </a>

      <a href="/admin/settings" class="nav-link" data-view="settings">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>AI Engine Settings</span>
      </a>

      <a href="/" class="portal-switch-card">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Patient Portal &rarr;</span>
      </a>
    </nav>

    <!-- Bottom User Profile (Matching image) -->
    <div class="sidebar-footer">
      <div class="footer-user">
        <div class="user-avatar-circle" style="background:var(--primary); color:#ffffff; font-weight:800;">A</div>
        <div class="user-meta">
          <span class="role" style="color:var(--primary); font-weight:800;">Super Admin</span>
          <span class="name">Anuj Chavan</span>
        </div>
      </div>
      <button class="settings-btn" id="btn-admin-signout" title="Sign Out">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main" id="admin-dynamic-content">
    <!-- Dynamic content rendered by admin.js -->
  </main>

  <!-- Inspection Modal for Details & Transcripts -->
  <div class="inspect-modal-overlay hidden" id="inspect-modal">
    <div class="inspect-modal-box">
      <div class="inspect-header">
        <h3 id="inspect-modal-title" style="font-size:16px; font-weight:800; color:#0f172a;">Consultation Details</h3>
        <button class="settings-btn" id="btn-close-modal" style="font-size:20px; font-weight:700;">&times;</button>
      </div>
      <div class="inspect-body" id="inspect-modal-body">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

</body>
</html>
