<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - MiraAI</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/nav_auth.js" defer></script>
</head>
<body style="background:#fafafa; display:flex; flex-direction:column; min-height:100vh;">

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <a href="/" class="brand-container" style="text-decoration:none;">
      <div class="brand-logo-flame"></div>
      <span class="brand-name">MiraAI</span>
    </a>

    <div class="nav-actions" id="top-nav-actions">
      <!-- Injected dynamically by nav_auth.js -->
    </div>
  </header>

  <main class="main-wrapper" style="display:flex; align-items:center; justify-content:center; flex:1;">
    <div style="max-width:540px; width:100%; background:#ffffff; border:1px solid var(--border-color); border-radius:20px; padding:44px 36px; text-align:center; box-shadow:var(--shadow-sm);">
      
      <div style="width:64px; height:64px; border-radius:50%; background:#fee2e2; color:#ef4444; display:inline-flex; align-items:center; justify-content:center; margin-bottom:20px;">
        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>

      <h1 style="font-size:24px; font-weight:800; color:#0f172a; margin-bottom:8px;">Admin Access Restricted</h1>
      <p style="font-size:14px; color:var(--text-muted); line-height:1.6; margin-bottom:24px;">
        Administrative pages and hospital records are strictly protected. Access is granted exclusively to verified administrator accounts.
      </p>

      <div id="logged-in-info" style="background:#f8fafc; border:1px solid var(--border-color); border-radius:12px; padding:14px; margin-bottom:24px; font-size:13px; color:#475569; text-align:left;">
        <div style="font-weight:700; color:#1e293b; margin-bottom:4px;">Current Status:</div>
        <div id="status-text">Not authenticated as administrator.</div>
      </div>

      <div style="display:flex; justify-content:center; gap:12px;">
        <a href="/" class="btn-outline" style="text-decoration:none; padding:10px 20px;">&larr; Patient Portal</a>
        <a href="/sign-in?redirect_url=/admin" class="btn-primary" style="text-decoration:none; padding:10px 22px;">Sign In with Admin Email &rarr;</a>
      </div>

    </div>
  </main>

  <script>
    const userEmail = localStorage.getItem('mira_user_email') || sessionStorage.getItem('mira_user_email');
    if (userEmail) {
      document.getElementById('status-text').innerHTML = `Signed in as <strong style="color:#0f172a;">${userEmail}</strong> (Patient account). This account does not possess Super Admin rights.`;
    }
  </script>
</body>
</html>
